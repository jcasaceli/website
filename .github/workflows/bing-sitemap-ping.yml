name: Ping Bing Sitemap
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * MON'
jobs:
  ping-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Bing sitemap
        run: |
          echo "Pinging Bing sitemap for nyshipdetox.com"
          curl -fsS "https://www.bing.com/webmaster/ping.aspx?siteMap=https://nyshipdetox.com/sitemap.xml"
