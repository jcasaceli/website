name: Daily Blog Post
# Generates one new, sourced NYSHIP blog post per day with Claude, rebuilds the
# site, commits, and pushes (Netlify deploys the change). Requires the repo
# secret ANTHROPIC_API_KEY. Runs even if your computer is off.
on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC ≈ 8–9am ET, daily
  workflow_dispatch: {}     # lets you run it on demand from the Actions tab

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Generate today's post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node blog/auto-post.js
      - name: Rebuild site
        run: node build.js
      - name: Commit & push
        run: |
          git config user.name "nyshipdetox-blog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes (topics may be exhausted) — nothing to publish."
          else
            git commit -m "Daily blog post ($(date +%F))"
            git push
          fi
      - name: Trigger Netlify deploy (fallback if push doesn't auto-deploy)
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: '[ -n "$HOOK" ] && curl -fsS -X POST "$HOOK" || echo "no build hook set (push auto-deploys)"'
